# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    groups:
      grafana:
        patterns:
          - "@grafana/*"
    # Every @grafana/* package declares peer react@^18, so a React 19 bump can
    # never resolve. Dependabot handles this gracefully for react itself, but on
    # react-dom it fails with "Error while updating peer dependency" and exits
    # non-zero, aborting the rest of the npm run. Lift these once Grafana
    # supports React 19.
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 20
    rebase-strategy: "auto"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      grafana-sdk:
        patterns:
          - "github.com/grafana/*"
    open-pull-requests-limit: 20
    rebase-strategy: "auto"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
    rebase-strategy: "auto"
