version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
    - noctx
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/dubsector/meraki-datasource
